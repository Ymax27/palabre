[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "palabre"
version = "0.1.0"
description = "Plateforme d'échange pour développeurs africains"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Palabre" }]
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy[asyncio]>=2",
    "asyncpg",
    "alembic",
    "pydantic-settings",
    "jinja2",
    "python-multipart",
    "itsdangerous",
    "argon2-cffi",
    "httpx",
    "sse-starlette",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pip-licenses",
    "pre-commit",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]

