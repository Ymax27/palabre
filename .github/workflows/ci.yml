name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Types
        run: mypy app

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: palabre
          POSTGRES_PASSWORD: palabre
          POSTGRES_DB: palabre
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U palabre -d palabre"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://palabre:palabre@localhost:5432/palabre
      SECRET_KEY: must-be-set-locally
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Tests
        run: pytest -q

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer les dépendances
        run: pip install -e ".[dev]"
      - name: Licences
        run: pip-licenses --fail-on="GNU;LGPL;AGPL"
