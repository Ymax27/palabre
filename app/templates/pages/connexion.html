{% extends "base.html" %}
{% block title %}Connexion · Palabre{% endblock %}
{% block content %}
  <h1>Connexion</h1>
  {% if github_enabled %}
    <p><a class="btn" href="/auth/github">{{ t("github_continue") }}</a></p>
    <p>{{ t("github_or") }}</p>
  {% endif %}
  <p>On t'envoie un lien magique. Pas de mot de passe.</p>
  <form method="post" action="/connexion">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" required autocomplete="email">
    <button type="submit">M'envoyer le lien</button>
  </form>
{% endblock %}
