{% extends "base.html" %}
{% block title %}Bienvenue · Palabre{% endblock %}
{% block content %}
  <h1>Présente-toi</h1>
  {% if error %}<p role="alert">{{ error }}</p>{% endif %}
  <form method="post" action="/onboarding">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <label for="handle">Pseudo</label>
    <input id="handle" name="handle" required minlength="3" maxlength="40">
    <label for="country">Pays</label>
    <select id="country" name="country" required>
      <option value="">Choisir</option>
      {% for code, label in countries %}
        <option value="{{ code }}">{{ label }}</option>
      {% endfor %}
    </select>
    <label for="stack">Stack principale</label>
    <select id="stack" name="stack" required>
      <option value="">Choisir</option>
      {% for tag in stacks %}
        <option value="{{ tag.label }}">{{ tag.label }}</option>
      {% endfor %}
    </select>
    <button type="submit">Rejoindre l'arbre</button>
  </form>
{% endblock %}
