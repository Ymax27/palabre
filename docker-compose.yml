services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: palabre
      POSTGRES_PASSWORD: palabre
      POSTGRES_DB: palabre
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U palabre -d palabre"]
      interval: 5s
      timeout: 5s
      retries: 5

  valkey:
    image: valkey/valkey:8
    ports:
      - "${VALKEY_PORT:-6379}:6379"

  app:
    build:
      context: .
      network: host
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://palabre:palabre@postgres:5432/palabre
      VALKEY_URL: redis://valkey:6379/0
      SECRET_KEY: ${SECRET_KEY:-must-be-set-locally}
      DEBUG: ${DEBUG:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  worker:
    build:
      context: .
      network: host
    command: ["arq", "app.jobs.worker.WorkerSettings"]
    environment:
      DATABASE_URL: postgresql+asyncpg://palabre:palabre@postgres:5432/palabre
      VALKEY_URL: redis://valkey:6379/0
      SECRET_KEY: ${SECRET_KEY:-must-be-set-locally}
      DEBUG: ${DEBUG:-true}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8000}
      SMTP_HOST: ${SMTP_HOST:-mailpit}
      SMTP_PORT: ${SMTP_PORT:-1025}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_started

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:
